{{- if .Values.redis.enabled -}}
---
apiVersion: v1
data:
  redis.conf: |-
    # Redis data directory.
    dir /data
    # Enable AOF https://redis.io/topics/persistence#append-only-file
    appendonly yes
    # Disable RDB persistence, AOF persistence already enabled.
    save ""
    rename-command FLUSHDB ""
    rename-command FLUSHALL ""
    # Redis ACL users are defined in the following format:
    #   user <username> ... acl rules ...
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/name: redis
  name: azul-redis-configuration
---
apiVersion: v1
data:
  start-master.sh: |
    #!/bin/bash
    
    [[ -f $REDIS_PASSWORD_FILE ]] && export REDIS_PASSWORD="$(< "${REDIS_PASSWORD_FILE}")"
    if [[ -f /opt/redis/mounted-etc/redis.conf ]];then
        printf "Base config found!\n"
        cp /opt/redis/mounted-etc/redis.conf /opt/redis/etc/redis.conf
    else 
        printf "Config not found!\n"
    fi
    
    if [[ -f $REDIS_USERNAME_FILE ]] 
    then
      export REDIS_USERNAME="$(< "${REDIS_USERNAME_FILE}")"
    else
      printf "User not set!\n"
      export REDIS_USERNAME="default"
    fi
    if [[ "default" == "$REDIS_USERNAME" ]] 
    then
      echo "user ${REDIS_USERNAME} ~* &* +@all on >${REDIS_PASSWORD}" >> /opt/redis/etc/redis.conf
    else 
      echo "user default off" >> /opt/redis/etc/redis.conf
      echo "user ${REDIS_USERNAME} ~* &* +@all on >${REDIS_PASSWORD}" >> /opt/redis/etc/redis.conf
    fi
    
    printf "USER: ${REDIS_USERNAME}\n"
    printf "PASS: ${REDIS_PASSWORD}\n"

    ARGS=("--port" "${REDIS_PORT}")
    ARGS+=("--masterauth" "${REDIS_PASSWORD}")
    ARGS+=("--include" "/opt/redis/etc/redis.conf")
    exec redis-server "${ARGS[@]}"
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/name: redis
  name: azul-redis-scripts
{{ end }}