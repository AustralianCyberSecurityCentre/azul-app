{{- define "harden.container" -}}
{{/* helper may be called with the root context or a dict containing "root" */}}
{{- $root := . -}}
{{- if not .Values }}{{ $root = .root }}{{ end -}}
{{- $sc := $root.Values.securityContext -}}
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]
    add: ["NET_BIND_SERVICE"]
  runAsNonRoot: true
  {{- with $sc.runAsUser }}
  runAsUser: {{ int64 . }}
  {{- end }}
  seccompProfile:
    type: RuntimeDefault
{{- end }}
