{{- define "vpa" -}}
{{/* Vertical Pod Autoscaler for a deployment. Requires the VPA CRDs/controller to be installed in the cluster. */}}
{{- if .vpa.enabled }}
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: {{ .name | required "vpa has no name" }}
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ .name | required "vpa has no name" }}
  updatePolicy:
    updateMode: {{ .vpa.updateMode | default "Off" | quote }}
  resourcePolicy:
    containerPolicies:
    - containerName: "*"
      controlledResources:
        {{- toYaml (.vpa.controlledResources | default (list "memory")) | nindent 8 }}
      {{- with .vpa.minAllowed }}
      minAllowed:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .vpa.maxAllowed }}
      maxAllowed:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
{{- end }}
